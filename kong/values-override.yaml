kong:
  deployment:
    kong:
      enabled: true
    serviceAccount:
      create: true

  env:
    log_level: "debug"
    nginx_worker_processes: "2"
    anonymous_reports: "off"
    database: "postgres"
    proxy_listen: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
    admin_listen: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
    status_listen: "0.0.0.0:8100"
    admin_gui_url: http://gwg.aibookclass.com:8002/manager         # Kong Manager UI가 외부에서 접근되는 도메인
    admin_gui_path: /manager
    # admin_api_uri: http://gwa.aibookclass.com:8001         # Admin API도 ALB 통해 80으로 접근

  admin:
    enabled: true
    type: NodePort
    # annotations:
    #   service.beta.kubernetes.io/ncloud-load-balancer-internal: "true" # LoadBalancer Type일꼉우 private subnet

    http:
      enabled: true
      servicePort: 8001
      containerPort: 8001

      # Set a nodePort which is available if service type is NodePort
      # nodePort: 32080
      # Additional listen parameters, e.g. "reuseport", "backlog=16384"
      parameters: []


    tls:
      enabled: true
      servicePort: 8444
      containerPort: 8444
      parameters: []

  # manager:
  #   type: LoadBalancer
  #   annotations:
  #     service.beta.kubernetes.io/ncloud-load-balancer-internal: "true"
  #   http:
  #     servicePort: 8002
  #     containerPort: 8002
  #   tls:
  #     servicePort: 8445
  #     containerPort: 8445
  #     parameters: []

  proxy:
    enabled: true
    type: LoadBalancer

    labels:
      enable-metrics: "true"

    http:
      enabled: true
      parameters: []

    tls:
      enabled: false
      parameters: []

  ingressController:
    enabled: true
    args: 
    - --anonymous-reports=false

    admissionWebhook:
      enabled: false

    ingressClass: kong
    ingressClassAnnotations: {}

    rbac:
      create: true
    
    env:
      kong_admin_url: http://localhost:8001

  postgresql:
    enabled: true #true면 내장, false 외장
    auth:
      password: kong
      postgresPassword: kongpassword  

  cluster:
    enabled: false